[mgr]
ratio = [1, 2, 2]
sort_by = "natural"
sort_dir_first = true
linemode = "mtime"

[preview]
max_width = 1024
max_height = 1024

[plugin]
prepend_previewers = [
  { mime = "application/*zip",            run = "ouch" },
  { mime = "application/x-tar",           run = "ouch" },
  { mime = "application/x-bzip2",         run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar",           run = "ouch" },
  { mime = "application/x-xz",            run = "ouch" },
]

[opener]
generic_open = [
  { run = 'xdg-open "%s"', desc = "Open" }
]
edit = [
  { run = 'nvim "%s"', block = true, spread = true }
]
extract = [
  { run = 'ouch d -y "%s"', desc = "Extract here with ouch" }
]
display = [
  { run = 'zathura "%s"', desc = "Show in Zathura", spread = true }
]

[open]
prepend_rules = [
  { url = "*.epub", use = "display" },
  { url = "*.pdf", use = "display" }
]
append_rules = [
  { url = "*", use = "generic_open" },
]
